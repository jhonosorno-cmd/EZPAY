schema: spec-driven

context: |
  Hackathon Open Payments 2026 (Medellín, 16–17 oct). Pagos por voz con grants limitados.
  Escribir todos los artefactos de OpenSpec en español neutro; identificadores, código y
  códigos de error en inglés.
  Regla del evento: todo el código se escribe durante el evento. Los specs y diseños previos
  no llevan código.
  Fuente de verdad de las interfaces entre servicios: "docs/contratos-http-v1.md", anexo de
  "docs/spec-general.md". Sus cambios de v1.1, ratificados el 16 oct, están en
  "docs/contratos-cambios-propuestos-v1.1.md" y ganan si chocan con v1. Los contratos son decisión del equipo: un spec
  nunca los contradice; si hace falta cambiarlos, se marca como cambio de contrato y requiere el
  OK de los cuatro.
  Requisitos comunes a todos los roles: capabilities payment-safety, voice-privacy y
  service-conventions (cambio add-team-baseline; después, openspec/specs/).
  Seguridad: nunca escribir llaves, tokens ni secretos en artefactos, logs o prompts.
  Los puntos marcados [VERIFICAR] dependen de experimentos (E0–E4) y no se dan por ciertos.

# Project context (optional)
